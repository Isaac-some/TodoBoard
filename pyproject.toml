[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todoboard-runtime"
version = "0.1.0"
description = "Open TodoBoard handoff runtime for personal agents and OpenViking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TodoBoard contributors"}]
dependencies = []

[project.scripts]
todoboardctl = "todoboard.cli:main"
todoboard-worker = "todoboard.worker:main"

[tool.setuptools.packages.find]
where = ["runtime"]
