name: Mac release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: swift test --scratch-path .build-local
      - run: python scripts/check-publication.py
      - run: ./scripts/build-app.sh
      - run: bash scripts/package-runtime.sh
      - run: python scripts/check-publication.py --artifacts
      - run: shasum -a 256 dist/TodoBoard.zip dist/TodoBoard-runtime.tar.gz > dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/TodoBoard.zip dist/TodoBoard-runtime.tar.gz dist/SHA256SUMS --clobber
