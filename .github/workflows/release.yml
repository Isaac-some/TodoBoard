name: Mac release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: swift test --scratch-path .build-local
      - run: python scripts/check-publication.py
      - run: ./scripts/build-app.sh
      - run: tar -czf dist/TodoBoard-runtime.tar.gz runtime pyproject.toml README.md LICENSE THIRD_PARTY_NOTICES.md scripts/install-runtime.sh
      - run: shasum -a 256 dist/TodoBoard.zip dist/TodoBoard-runtime.tar.gz > dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/TodoBoard.zip dist/TodoBoard-runtime.tar.gz dist/SHA256SUMS --generate-notes
