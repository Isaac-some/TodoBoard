name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s Tests -v
      - run: python scripts/check-publication.py
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test --scratch-path .build-local
